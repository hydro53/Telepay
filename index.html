<!DOCTYPE html>
<html>
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <title>Telepay Wallet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a237e;
      color: white;
      text-align: center;
      padding: 30px 16px;
      margin: 0;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }
    .balance {
      font-size: 44px;
      font-weight: bold;
      color: #ffffff;
      margin: 16px 0 30px;
    }
    .card {
      background: #283593;
      border-radius: 16px;
      padding: 20px;
      margin: 16px auto;
      max-width: 400px;
    }
    .card h3 {
      margin-top: 0;
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1a237e;
      color: white;
      margin-bottom: 10px;
    }
    input:focus {
      outline: none;
      border-color: #4ade80;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #000000;
      color: #ffffff;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
    #statusMessage {
      color: #94a3b8;
      min-height: 20px;
    }
    #historyList p {
      text-align: left;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
      margin: 0;
    }
    #historyList a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Telepay</h1>
  <p>Your balance</p>
  <div class="balance" id="balanceDisplay">Loading...</div>

  <div class="card">
    <h3>TON Wallet</h3>
    <div id="ton-connect-button"></div>
    <p id="tonAddress" style="font-size: 12px; color: #94a3b8; word-break: break-all;"></p>
  </div>

  <div class="card">
    <h3>Send TON (Testnet)</h3>
    <input type="text" id="tonRecipientInput" placeholder="@username">
    <input type="number" id="tonAmountInput" placeholder="Amount (TON)" step="0.01">
    <button onclick="sendRealTon()">Send TON</button>
  </div>

  <div class="card">
    <h3>Request TON</h3>
    <input type="text" id="requestUsernameInput" placeholder="@username">
    <input type="number" id="requestAmountInput" placeholder="Amount (TON)" step="0.01">
    <button onclick="requestRealTon()">Request TON</button>
  </div>

  <div class="card">
    <h3>Recent Transactions</h3>
    <div id="historyList"></div>
  </div>

  <div class="card">
    <h3>Receive TON</h3>
    <canvas id="qrCanvas" style="max-width: 200px; margin: 0 auto; display: block;"></canvas>
    <p id="receiveAddress" style="font-size: 12px; color: #94a3b8; word-break: break-all; margin-top: 12px;"></p>
  </div>

  <p id="statusMessage"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe?.user?.id || "7512356461";
    const urlParams = new URLSearchParams(window.location.search);
    const prefillRecipient = urlParams.get("to");
    const prefillAmount = urlParams.get("amount");

    function loadBalance() {
      fetch(`/ton-balance/${userId}`)
        .then(response => response.json())
        .then(data => {
          if (!data.connected) {
            document.getElementById("balanceDisplay").textContent = "Connect wallet";
          } else {
            document.getElementById("balanceDisplay").textContent = data.balance + " TON";
          }
        })
        .catch(error => {
          document.getElementById("balanceDisplay").textContent = "Error loading balance";
        });
    }

    function loadHistory() {
      fetch(`/transactions/${userId}`)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById("historyList");
          container.innerHTML = "";

          if (!data.transactions || data.transactions.length === 0) {
            container.textContent = "No transactions yet.";
            return;
          }

          data.transactions.forEach(t => {
            const isSender = t.from == userId;
            const direction = isSender ? "Sent" : "Received";
            const date = new Date(t.date).toLocaleDateString();
            const line = document.createElement("p");
            line.innerHTML = `${direction} ${t.amount} TON — ${date}`;

            if (t.explorerAddress) {
              const link = document.createElement("a");
              link.href = `https://testnet.tonviewer.com/${t.explorerAddress}`;
              link.target = "_blank";
              link.textContent = " (View)";
              link.style.color = "#4ade80";
              line.appendChild(link);
            }

            container.appendChild(line);
          });
        });
    }

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://telepay-production.up.railway.app/tonconnect-manifest.json',
      buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
      if (wallet) {
        document.getElementById('tonAddress').textContent = 'Connected: ' + wallet.account.address;
        document.getElementById('receiveAddress').textContent = wallet.account.address;
        QRCode.toCanvas(document.getElementById('qrCanvas'), wallet.account.address, { width: 200 });
        fetch('/link-wallet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, tonAddress: wallet.account.address })
        }).then(() => loadBalance());
      } else {
        document.getElementById('tonAddress').textContent = '';
        document.getElementById('receiveAddress').textContent = '';
      }
    });

    async function sendRealTon() {
      const recipientUsername = document.getElementById("tonRecipientInput").value.replace("@", "");
      const amountTon = parseFloat(document.getElementById("tonAmountInput").value);

      if (!tonConnectUI.connected) {
        document.getElementById("statusMessage").textContent = "Please connect your wallet first.";
        return;
      }

      document.getElementById("statusMessage").textContent = "Looking up recipient...";

      let recipientAddress;
      try {
        const lookupResponse = await fetch(`/resolve-ton-address/${recipientUsername}`);
        const lookupData = await lookupResponse.json();
        if (lookupData.error) {
          document.getElementById("statusMessage").textContent = lookupData.error;
          return;
        }
        recipientAddress = lookupData.tonAddress;
      } catch (error) {
        document.getElementById("statusMessage").textContent = "Failed to look up recipient.";
        return;
      }

      const amountNano = Math.floor(amountTon * 1_000_000_000).toString();

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 300,
        messages: [
          {
            address: recipientAddress,
            amount: amountNano
          }
        ]
      };

      try {
        await tonConnectUI.sendTransaction(transaction);
        document.getElementById("statusMessage").textContent = "Transaction sent! Check your wallet.";

        await fetch("/log-transaction", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from: userId, to: recipientUsername, amount: amountTon, explorerAddress: recipientAddress })
        });

        await fetch("/notify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ senderId: userId, recipientUsername, amount: amountTon })
        });

        setTimeout(() => {
          loadBalance();
          loadHistory();
        }, 3000);
      } catch (error) {
        console.log("Transaction error details:", error);
        document.getElementById("statusMessage").textContent = "Error: " + (error.message || "Transaction cancelled or failed.");
      }
    }

    async function requestRealTon() {
      const targetUsername = document.getElementById("requestUsernameInput").value.replace("@", "");
      const amount = document.getElementById("requestAmountInput").value;

      const response = await fetch("/send-request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          requesterId: userId,
          targetUsername,
          amount
        })
      });
      const data = await response.json();

      if (data.error) {
        document.getElementById("statusMessage").textContent = data.error;
      } else {
        document.getElementById("statusMessage").textContent = "Request sent!";
      }
    }

    if (prefillRecipient) {
      document.getElementById("tonRecipientInput").value = prefillRecipient;
    }
    if (prefillAmount) {
      document.getElementById("tonAmountInput").value = prefillAmount;
    }
    if (prefillRecipient && prefillAmount) {
      document.getElementById("statusMessage").innerHTML =
        `<strong>Sending ${prefillAmount} TON to @${prefillRecipient}</strong><br>Review below and tap Send TON to confirm.`;
    }

    loadBalance();
    loadHistory();
  </script>
</body>
</html>
