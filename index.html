<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TelePay Wallet (Redesign Starter)</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#10151F;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:18px}
.profile{width:42px;height:42px;border-radius:50%;background:#299CFF;display:flex;align-items:center;justify-content:center}
.tab{text-align:center;font-weight:bold}
.card{background:#1A2230;margin:16px;border-radius:20px;padding:18px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px}
.action{background:#1A2230;border-radius:16px;padding:14px;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1A2230;padding:14px;display:flex;justify-content:space-around}
</style>
</head>
<body>
<div class="header">
<h2>TelePay</h2>
<div class="profile">👤</div>
</div>

<div class="tab">Wallet</div>

<div class="card">
<h3>Finish setting up your wallet</h3>
<p>• Connect crypto wallet</p>
<p>• Link Nigerian bank account</p>
<button>Continue</button>
</div>

<div class="card">
<h3>USD</h3>
<h1>$0.00</h1>
<p>NGN</p>
<h2>₦0.00</h2>
</div>

<div class="actions">
<div class="action">Send</div>
<div class="action">Request</div>
<div class="action">Withdraw</div>
<div class="action">Exchange</div>
</div>

<div class="card">
<h3>Crypto Portfolio</h3>
<p>Bitcoin</p>
<p>Ethereum</p>
<p>Solana</p>
<p>USDT</p>
</div>

<div class="bottom">
<div>Wallet</div>
<div>Portfolio</div>
</div>

<!-- Integrate your existing JavaScript from the current project below this line -->
</body>
</html>
